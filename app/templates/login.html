{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<div class="flash flash-error" role="alert" id="login-error">{{ error }}</div>{% endif %}
<form method="post" action="/login" class="narrow-form">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" value="{{ email }}" required {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
  </div>
  <button type="submit">Sign in</button>
</form>
{% if settings.env != "prod" %}
<aside class="hint" aria-label="Demo accounts">
  <p>Demo accounts: alice@example.com / alice-pass, bob@example.com / bob-pass.</p>
</aside>
{% endif %}
{% endblock %}
