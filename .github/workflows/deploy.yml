name: Deploy

# daily: every green CI run on main.
# pre:   run this workflow by hand with target=pre (optionally a commit SHA; default: latest main).
# prod:  run it with target=prod. It ships the exact image that is on pre, after the
#        "prod" GitHub Environment's required reviewers approve.
#
# Each environment's tag (:daily, :pre, :prod) is moved to the chosen digest, then the
# Render deploy hook redeploys the service, whose preDeployCommand runs migrations.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [pre, prod]
        required: true
      sha:
        description: "pre only: commit to deploy (default: latest main)"
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/alvis051/demo-shop

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'daily' }}
    concurrency: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'daily' }}
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'daily' }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick the image
        id: pick
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TARGET" in
            daily) source="$IMAGE:sha-$RUN_SHA" ;;
            pre)
              sha="$INPUT_SHA"
              if [ -z "$sha" ]; then
                sha=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/${{ github.repository }}/commits/main" | jq -r .sha)
              fi
              source="$IMAGE:sha-$sha" ;;
            prod) source="$IMAGE:pre" ;;
          esac
          digest=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' | jq -r .digest)
          echo "Deploying $source ($digest) to $TARGET"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Point the environment's tag at it
        run: docker buildx imagetools create --tag "$IMAGE:$TARGET" "$IMAGE@${{ steps.pick.outputs.digest }}"

      - name: Trigger the Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK is not set for $TARGET; tag moved but nothing was deployed."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null

      - name: Wait for the new version to serve
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          want=$(docker buildx imagetools inspect "$IMAGE@${{ steps.pick.outputs.digest }}" \
            --format '{{json .Image}}' | jq -r '.config.Env[] | select(startswith("APP_VERSION=")) | sub("APP_VERSION="; "")')
          for i in $(seq 60); do
            got=$(curl -fsS "$APP_URL/healthz" || true)
            echo "healthz: $got"
            [ "$got" = "ok $want" ] && exit 0
            sleep 10
          done
          echo "::error::$TARGET did not start serving $want within 10 minutes"
          exit 1
