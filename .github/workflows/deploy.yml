name: Deploy

# daily: every green CI run on main.
# pre:   run this workflow by hand with target=pre (optionally a commit SHA; default: latest main).
# prod:  run it with target=prod. It ships the exact image that is on pre, after the
#        "prod" GitHub Environment's required reviewers approve.
#
# Each deploy moves the environment's tag (:daily, :pre, :prod) to the chosen digest,
# runs the migration job on that image, then rolls the Cloud Run service to it.
# Google Cloud access is through Workload Identity Federation: each environment has its
# own deployer, which only a job in that GitHub Environment can use (see infra/).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [pre, prod]
        required: true
      sha:
        description: "pre only: commit to deploy (default: latest main)"
        required: false

permissions:
  contents: read
  id-token: write

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/demo-shop/demo-shop
  REGION: ${{ vars.GCP_REGION }}

jobs:
  deploy:
    # Skipped until infra/ is applied and the repository variables are set.
    if: >-
      vars.GCP_PROJECT != '' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'daily' }}
    concurrency: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'daily' }}
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'daily' }}
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: deploy-${{ env.TARGET }}@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Pick the image
        id: pick
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TARGET" in
            daily) source="$IMAGE:sha-$RUN_SHA" ;;
            pre)
              sha="$INPUT_SHA"
              if [ -z "$sha" ]; then
                sha=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/${{ github.repository }}/commits/main" | jq -r .sha)
              fi
              source="$IMAGE:sha-$sha" ;;
            prod) source="$IMAGE:pre" ;;
          esac
          digest=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' | jq -r .digest)
          echo "Deploying $source ($digest) to $TARGET"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Point the environment's tag at it
        run: docker buildx imagetools create --tag "$IMAGE:$TARGET" "$IMAGE@${{ steps.pick.outputs.digest }}"

      # Migrations run before traffic moves, so they must stay compatible with the
      # version still serving (expand/contract).
      - name: Migrate and seed
        run: |
          gcloud run jobs update "demo-shop-migrate-$TARGET" --region "$REGION" \
            --image "$IMAGE@${{ steps.pick.outputs.digest }}"
          gcloud run jobs execute "demo-shop-migrate-$TARGET" --region "$REGION" --wait

      - name: Roll the service
        run: |
          gcloud run services update "demo-shop-$TARGET" --region "$REGION" \
            --image "$IMAGE@${{ steps.pick.outputs.digest }}"

      - name: Check the new version is serving
        run: |
          url=$(gcloud run services describe "demo-shop-$TARGET" --region "$REGION" --format 'value(status.url)')
          want=$(docker buildx imagetools inspect "$IMAGE@${{ steps.pick.outputs.digest }}" \
            --format '{{json .Image}}' | jq -r '.config.Env[] | select(startswith("APP_VERSION=")) | sub("APP_VERSION="; "")')
          # The first request may wait on a cold start and on Neon waking up.
          for i in $(seq 12); do
            got=$(curl -fsS --max-time 30 "$url/health" || true)
            echo "health: $got"
            [ "$got" = "ok $want" ] && echo "$TARGET is serving $want at $url" && exit 0
            sleep 5
          done
          echo "::error::$TARGET is not serving $want at $url"
          exit 1
