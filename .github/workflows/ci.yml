name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/demo-shop/demo-shop

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://shop:shop@127.0.0.1:5432/shop
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migrations go up, down and up, and match the models
        env:
          DEMO_SHOP_ENV: staging
          SESSION_SECRET: ci-only
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
          uv run python -m app.seed
          uv run python -m app.seed
      - name: App starts in test mode on a random port
        run: |
          .venv/bin/python -m app > app.log 2>&1 &
          pid=$!
          for i in $(seq 60); do grep -q listening app.log && break; sleep 0.5; done
          url=$(grep -o 'http://[^ ]*' app.log)
          curl -fsS "$url/health"
          kill -INT $pid && wait $pid
          cat app.log

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Images are pushed from main once infra/ is applied and the repository variables are set.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: auth
        if: env.PUSH == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: image-pusher@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com
          token_format: access_token
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: GIT_SHA=${{ github.sha }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.PUSH == 'true' && format('{0}:sha-{1}', env.IMAGE, github.sha) || format('demo-shop:sha-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
